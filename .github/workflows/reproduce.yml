name: Reproduce and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Reproduce all results
        run: python run_all.py

      - name: Show reproduction summary
        if: success()
        shell: bash
        run: |
          echo "## Semantic Lifetime Width reproduction" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tests and the full reproduction workflow completed successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat results/summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reproduced tables, figures, and summary
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: semantic-lifetime-width-results-${{ github.run_number }}
          path: |
            results/tables/*.csv
            results/figures/*.png
            results/summary.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
